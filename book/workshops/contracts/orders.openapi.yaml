{
  "openapi": "3.0.3",
  "info": {
    "title": "Orders acceptance contract workshop",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "http://127.0.0.1:18881/api"
    }
  ],
  "paths": {
    "/orders": {
      "post": {
        "operationId": "acceptOrder",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/OrderCommand"
              },
              "example": {
                "orderId": "A-1001",
                "items": [
                  {
                    "sku": "PEN-01",
                    "qty": 4
                  },
                  {
                    "sku": "PAD-22",
                    "qty": 2
                  },
                  {
                    "sku": "CLP-08",
                    "qty": 10
                  }
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Recorded result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OrderResponse"
                }
              }
            }
          },
          "201": {
            "description": "Accepted order",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OrderResponse"
                }
              }
            }
          },
          "400": {
            "description": "Invalid command",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "401": {
            "description": "Missing application principal",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "409": {
            "description": "Command conflict",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "500": {
            "description": "Internal failure",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "503": {
            "description": "Dependency unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        }
      }
    },
    "/orders/{orderId}": {
      "parameters": [
        {
          "name": "orderId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^[A-Za-z0-9-]{1,40}$"
          }
        }
      ],
      "get": {
        "operationId": "getOrder",
        "responses": {
          "200": {
            "description": "Recorded result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OrderResponse"
                }
              }
            }
          },
          "401": {
            "description": "Missing application principal",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "404": {
            "description": "Order not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "500": {
            "description": "Internal failure",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "OrderCommand": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "orderId",
          "items"
        ],
        "properties": {
          "orderId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9-]{1,40}$"
          },
          "items": {
            "type": "array",
            "minItems": 1,
            "maxItems": 20,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "sku",
                "qty"
              ],
              "properties": {
                "sku": {
                  "type": "string",
                  "enum": [
                    "PEN-01",
                    "PAD-22",
                    "CLP-08"
                  ]
                },
                "qty": {
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 1000
                }
              }
            }
          }
        }
      },
      "OrderResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "orderId",
          "tenantId",
          "currency",
          "state",
          "total",
          "items"
        ],
        "properties": {
          "orderId": {
            "type": "string"
          },
          "tenantId": {
            "type": "string"
          },
          "currency": {
            "type": "string",
            "enum": [
              "USD"
            ]
          },
          "state": {
            "type": "string",
            "enum": [
              "ACCEPTED"
            ]
          },
          "total": {
            "type": "number"
          },
          "items": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "sku",
                "qty",
                "unitPrice",
                "lineTotal"
              ],
              "properties": {
                "sku": {
                  "type": "string"
                },
                "qty": {
                  "type": "integer"
                },
                "unitPrice": {
                  "type": "number"
                },
                "lineTotal": {
                  "type": "number"
                }
              }
            }
          }
        }
      },
      "Problem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "string"
          }
        }
      }
    }
  }
}
